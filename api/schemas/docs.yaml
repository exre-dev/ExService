# Docs 领域 schema：空间、文档树、回收站、Tiptap 正文 profile 与 B 类预留能力。
# 所有 $ref 均以相对路径指回根文档 api/openapi.yaml 的 components。
# 本文件只描述 HTTP 形状；语法、父子关系、网格与预算由 Server 在内容 profile 内独立校验。

DocsVersion:
  type: integer
  minimum: 1
  maximum: 9007199254740991
  description: 乐观并发版本号；不接受字符串或小数。
DocsCursor:
  type: [string, 'null']
  minLength: 1
  maxLength: 1024
  description: 不透明分页游标；null 表示没有下一页。游标绑定树版本代际，不能当作权限证明，也不能跨空间或跨父层复用。
DocsTitle:
  type: string
  minLength: 1
  maxLength: 200
  description: 文档标题；服务端 trim 后按 Unicode 码点限制为 1 至 200，拒绝全空白。
DocsSpaceName:
  type: string
  minLength: 1
  maxLength: 100
  description: 空间名与模板名；服务端 trim 后按 Unicode 码点限制为 1 至 100。
DocsDescription:
  type: string
  minLength: 0
  maxLength: 2000
  description: 空间描述；保留正文空白，不做 trim。
DocsContentSchemaVersion:
  type: integer
  const: 1
  description: 持久内容协议版本；不等于文档 version 或 Tiptap npm 版本。未知版本明确拒绝，不猜测转换。

DocsSpace:
  type: object
  additionalProperties: false
  required: [id, name, description, version, treeVersion, createdAt, updatedAt]
  properties:
    id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    name: { $ref: '../openapi.yaml#/components/schemas/DocsSpaceName' }
    description: { $ref: '../openapi.yaml#/components/schemas/DocsDescription' }
    version: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    treeVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    createdAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
    updatedAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
DocsSpacePage:
  type: object
  additionalProperties: false
  required: [items, nextCursor]
  properties:
    items:
      type: array
      maxItems: 200
      items: { $ref: '../openapi.yaml#/components/schemas/DocsSpace' }
    nextCursor: { $ref: '../openapi.yaml#/components/schemas/DocsCursor' }
DocsTreeNode:
  type: object
  additionalProperties: false
  required: [id, spaceId, parentId, title, position, version, hasChildren]
  properties:
    id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    spaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    parentId:
      description: 父文档 ID；null 表示根层。树 operation 只返回活动节点。
      oneOf:
        - $ref: '../openapi.yaml#/components/schemas/Uuid'
        - type: 'null'
    title: { $ref: '../openapi.yaml#/components/schemas/DocsTitle' }
    position: { type: integer, minimum: 0, maximum: 9007199254740991 }
    version: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    hasChildren: { type: boolean }
DocsTreePage:
  type: object
  additionalProperties: false
  required: [items, treeVersion, nextCursor]
  properties:
    items:
      type: array
      maxItems: 200
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTreeNode' }
    treeVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    nextCursor: { $ref: '../openapi.yaml#/components/schemas/DocsCursor' }
DocsDocument:
  type: object
  additionalProperties: false
  required:
    [
      id,
      spaceId,
      parentId,
      title,
      position,
      version,
      hasChildren,
      contentSchemaVersion,
      content,
      createdAt,
      updatedAt,
    ]
  properties:
    id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    spaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    parentId:
      description: 父文档 ID；null 表示根层。
      oneOf:
        - $ref: '../openapi.yaml#/components/schemas/Uuid'
        - type: 'null'
    title: { $ref: '../openapi.yaml#/components/schemas/DocsTitle' }
    position: { type: integer, minimum: 0, maximum: 9007199254740991 }
    version: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    hasChildren:
      type: boolean
      description: 只计活动直接子节点；已回收行的该值通常为 false，其存在不授予读取子树的能力。
    contentSchemaVersion: { $ref: '../openapi.yaml#/components/schemas/DocsContentSchemaVersion' }
    content: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapDocument' }
    createdAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
    updatedAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
DocsDocumentResult:
  type: object
  additionalProperties: false
  required: [document, treeVersion]
  properties:
    document: { $ref: '../openapi.yaml#/components/schemas/DocsDocument' }
    treeVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
DocsSpaceVersion:
  type: object
  additionalProperties: false
  required: [spaceId, treeVersion]
  properties:
    spaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    treeVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
DocsMoveResult:
  type: object
  additionalProperties: false
  required: [documentId, version, source, target, affectedCount]
  properties:
    documentId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    version: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    source: { $ref: '../openapi.yaml#/components/schemas/DocsSpaceVersion' }
    target: { $ref: '../openapi.yaml#/components/schemas/DocsSpaceVersion' }
    affectedCount:
      type: integer
      minimum: 1
      maximum: 20000
      description: 本次文档字段实际更新的去重行数；成功 no-op 至少更新根。跨空间包含两侧同级重排。
DocsTrashResult:
  type: object
  additionalProperties: false
  required: [documentId, version, spaceId, treeVersion, deletionBatchId, trashedCount]
  properties:
    documentId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    version: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    spaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    treeVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    deletionBatchId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    trashedCount:
      type: integer
      minimum: 1
      maximum: 10000
      description: 仅本次新回收的成员，不包含旧批次。
DocsTrashGroup:
  type: object
  additionalProperties: false
  required:
    [documentId, spaceId, parentId, title, version, deletionBatchId, deletedAt, documentCount]
  properties:
    documentId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    spaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    parentId:
      description: 回收根当时的父文档 ID；null 表示根层。
      oneOf:
        - $ref: '../openapi.yaml#/components/schemas/Uuid'
        - type: 'null'
    title: { $ref: '../openapi.yaml#/components/schemas/DocsTitle' }
    version: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    deletionBatchId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    deletedAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
    documentCount:
      type: integer
      minimum: 1
      maximum: 10000
      description: 仅同批次成员。
DocsTrashPage:
  type: object
  additionalProperties: false
  required: [items, treeVersion, nextCursor]
  properties:
    items:
      type: array
      maxItems: 200
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTrashGroup' }
    treeVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    nextCursor: { $ref: '../openapi.yaml#/components/schemas/DocsCursor' }
DocsDeletionFacts:
  type: object
  additionalProperties: false
  required: [batchId, rootId, deletedAt]
  properties:
    batchId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    rootId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    deletedAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
DocsTrashedDocumentResult:
  type: object
  additionalProperties: false
  required: [document, treeVersion, deletion]
  properties:
    document: { $ref: '../openapi.yaml#/components/schemas/DocsDocument' }
    treeVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    deletion: { $ref: '../openapi.yaml#/components/schemas/DocsDeletionFacts' }
DocsRestoreResult:
  type: object
  additionalProperties: false
  required:
    [documentId, version, spaceId, treeVersion, restoredCount, retainedTrashedCount, placement]
  properties:
    documentId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    version: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    spaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    treeVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    restoredCount: { type: integer, minimum: 1, maximum: 10000 }
    retainedTrashedCount:
      type: integer
      minimum: 0
      maximum: 10000
      description: 恢复后仍位于该根物理子树中的其他回收批次成员，不计已经独立恢复并脱离的节点。
    placement:
      type: string
      enum: [original-parent, space-root]

DocsCreateSpaceRequest:
  type: object
  additionalProperties: false
  required: [name, description]
  properties:
    name: { $ref: '../openapi.yaml#/components/schemas/DocsSpaceName' }
    description: { $ref: '../openapi.yaml#/components/schemas/DocsDescription' }
DocsUpdateSpaceRequest:
  description: 空间更新同时提交名字和描述，避免可省略字段与清空语义混淆。
  type: object
  additionalProperties: false
  required: [expectedVersion, name, description]
  properties:
    expectedVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    name: { $ref: '../openapi.yaml#/components/schemas/DocsSpaceName' }
    description: { $ref: '../openapi.yaml#/components/schemas/DocsDescription' }
DocsDeleteSpaceRequest:
  type: object
  additionalProperties: false
  required: [expectedVersion, expectedTreeVersion]
  properties:
    expectedVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    expectedTreeVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
DocsCreateDocumentRequest:
  type: object
  additionalProperties: false
  required: [expectedTreeVersion, parentId, beforeDocumentId, title, contentSchemaVersion, content]
  properties:
    expectedTreeVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    parentId:
      description: 父文档 ID；null 表示创建在根层。父与锚点必须属于 path 空间且活动。
      oneOf:
        - $ref: '../openapi.yaml#/components/schemas/Uuid'
        - type: 'null'
    beforeDocumentId:
      description: 同级重排锚点；null 表示追加到同级末尾。
      oneOf:
        - $ref: '../openapi.yaml#/components/schemas/Uuid'
        - type: 'null'
    title: { $ref: '../openapi.yaml#/components/schemas/DocsTitle' }
    contentSchemaVersion: { $ref: '../openapi.yaml#/components/schemas/DocsContentSchemaVersion' }
    content: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapDocument' }
DocsSaveDocumentRequest:
  description: 完整替换标题与正文；不允许改父、改空间或改顺序。
  type: object
  additionalProperties: false
  required: [expectedSpaceId, expectedVersion, title, contentSchemaVersion, content]
  properties:
    expectedSpaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    expectedVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    title: { $ref: '../openapi.yaml#/components/schemas/DocsTitle' }
    contentSchemaVersion: { $ref: '../openapi.yaml#/components/schemas/DocsContentSchemaVersion' }
    content: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapDocument' }
DocsMoveDocumentRequest:
  type: object
  additionalProperties: false
  required:
    [
      sourceSpaceId,
      targetSpaceId,
      expectedVersion,
      expectedSourceTreeVersion,
      expectedTargetTreeVersion,
      parentId,
      beforeDocumentId,
    ]
  properties:
    sourceSpaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    targetSpaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    expectedVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    expectedSourceTreeVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    expectedTargetTreeVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    parentId:
      description: 目标父文档 ID；null 表示目标空间根层。父与锚点必须属于目标空间。
      oneOf:
        - $ref: '../openapi.yaml#/components/schemas/Uuid'
        - type: 'null'
    beforeDocumentId:
      description: 目标同级重排锚点；null 表示追加到同级末尾。
      oneOf:
        - $ref: '../openapi.yaml#/components/schemas/Uuid'
        - type: 'null'
DocsTrashDocumentRequest:
  description: 只接受活动根；整棵物理子树一起进入回收站。
  type: object
  additionalProperties: false
  required: [expectedSpaceId, expectedVersion, expectedTreeVersion]
  properties:
    expectedSpaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    expectedVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    expectedTreeVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
DocsRestoreDocumentRequest:
  description: 恢复当前整批；path 必须是该批次的根。没有 targetSpaceId、parentId、children 或 includePrevious 字段。
  type: object
  additionalProperties: false
  required: [expectedSpaceId, expectedVersion, expectedTreeVersion, deletionBatchId]
  properties:
    expectedSpaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    expectedVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    expectedTreeVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    deletionBatchId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }

DocsSearchHit:
  type: object
  additionalProperties: false
  required: [documentId, spaceId, title, excerpt]
  properties:
    documentId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    spaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    title: { $ref: '../openapi.yaml#/components/schemas/DocsTitle' }
    excerpt: { type: string, minLength: 0, maxLength: 500 }
DocsSearchPage:
  type: object
  additionalProperties: false
  required: [items, nextCursor]
  properties:
    items:
      type: array
      maxItems: 50
      items: { $ref: '../openapi.yaml#/components/schemas/DocsSearchHit' }
    nextCursor: { $ref: '../openapi.yaml#/components/schemas/DocsCursor' }
DocsAiSuggestionRequest:
  description: AI 不接受调用方提交整篇待保存正文；只提交指令并核对 baseVersion。
  type: object
  additionalProperties: false
  required: [expectedSpaceId, baseVersion, instruction]
  properties:
    expectedSpaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    baseVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    instruction: { type: string, minLength: 1, maxLength: 2000 }
DocsAiSuggestion:
  type: object
  additionalProperties: false
  required: [documentId, baseVersion, contentSchemaVersion, proposedTitle, proposedContent]
  properties:
    documentId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    baseVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    contentSchemaVersion: { $ref: '../openapi.yaml#/components/schemas/DocsContentSchemaVersion' }
    proposedTitle: { $ref: '../openapi.yaml#/components/schemas/DocsTitle' }
    proposedContent: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapDocument' }
DocsTemplate:
  type: object
  additionalProperties: false
  required: [id, spaceId, name, contentSchemaVersion, content, version, createdAt, updatedAt]
  properties:
    id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    spaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    name: { $ref: '../openapi.yaml#/components/schemas/DocsSpaceName' }
    contentSchemaVersion: { $ref: '../openapi.yaml#/components/schemas/DocsContentSchemaVersion' }
    content: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapDocument' }
    version: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    createdAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
    updatedAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
DocsTemplateSummary:
  description: 模板列表项；字段与 DocsTemplate 相同，只是不含正文。
  type: object
  additionalProperties: false
  required: [id, spaceId, name, contentSchemaVersion, version, createdAt, updatedAt]
  properties:
    id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    spaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    name: { $ref: '../openapi.yaml#/components/schemas/DocsSpaceName' }
    contentSchemaVersion: { $ref: '../openapi.yaml#/components/schemas/DocsContentSchemaVersion' }
    version: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    createdAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
    updatedAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
DocsTemplatePage:
  type: object
  additionalProperties: false
  required: [items, nextCursor]
  properties:
    items:
      type: array
      maxItems: 200
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTemplateSummary' }
    nextCursor: { $ref: '../openapi.yaml#/components/schemas/DocsCursor' }
DocsCreateTemplateRequest:
  type: object
  additionalProperties: false
  required: [name, contentSchemaVersion, content]
  properties:
    name: { $ref: '../openapi.yaml#/components/schemas/DocsSpaceName' }
    contentSchemaVersion: { $ref: '../openapi.yaml#/components/schemas/DocsContentSchemaVersion' }
    content: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapDocument' }
DocsUpdateTemplateRequest:
  type: object
  additionalProperties: false
  required: [expectedSpaceId, expectedVersion, name, contentSchemaVersion, content]
  properties:
    expectedSpaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    expectedVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    name: { $ref: '../openapi.yaml#/components/schemas/DocsSpaceName' }
    contentSchemaVersion: { $ref: '../openapi.yaml#/components/schemas/DocsContentSchemaVersion' }
    content: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapDocument' }
DocsDeleteTemplateRequest:
  type: object
  additionalProperties: false
  required: [expectedSpaceId, expectedVersion]
  properties:
    expectedSpaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    expectedVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
DocsApplyTemplateRequest:
  description: 应用模板只复制正文并保留文档标题；文档与模板必须同空间。模板不建立应用记录。
  type: object
  additionalProperties: false
  required: [expectedSpaceId, expectedVersion, templateId, expectedTemplateVersion]
  properties:
    expectedSpaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    expectedVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    templateId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    expectedTemplateVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
DocsAttachment:
  type: object
  additionalProperties: false
  required: [id, documentId, fileName, contentType, byteSize, sha256, createdAt]
  properties:
    id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    documentId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    fileName: { type: string, minLength: 1, maxLength: 255 }
    contentType: { $ref: '../openapi.yaml#/components/schemas/StorageContentType' }
    byteSize: { type: integer, minimum: 1, maximum: 9007199254740991 }
    sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: 小写十六进制 SHA-256；不外发 medium 或 storage key。
    createdAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
DocsAttachmentPage:
  type: object
  additionalProperties: false
  required: [items, nextCursor]
  properties:
    items:
      type: array
      maxItems: 200
      items: { $ref: '../openapi.yaml#/components/schemas/DocsAttachment' }
    nextCursor: { $ref: '../openapi.yaml#/components/schemas/DocsCursor' }
DocsAttachmentAccess:
  type: object
  additionalProperties: false
  required: [attachment, downloadUrl]
  properties:
    attachment: { $ref: '../openapi.yaml#/components/schemas/DocsAttachment' }
    downloadUrl:
      type: string
      format: uri
      minLength: 1
      maxLength: 2048
      description: 绝对 HTTP(S) 地址；有效期由介质决定，不承诺永久可用。
DocsAttachmentUploadRequest:
  description: 仅用于 multipart。恰好一个二进制 data part，以及限定的 fileName、contentType、expectedSpaceId、expectedDocumentVersion 文本字段；不允许 medium、key、url 或 ticket。filename 不决定存储路径，路径由服务端生成。
  type: object
  additionalProperties: false
  required: [data, fileName, contentType, expectedSpaceId, expectedDocumentVersion]
  properties:
    data:
      type: string
      format: binary
    fileName: { type: string, minLength: 1, maxLength: 255 }
    contentType: { $ref: '../openapi.yaml#/components/schemas/StorageContentType' }
    expectedSpaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    expectedDocumentVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
DocsDeleteAttachmentRequest:
  description: 附件删除是解除关联，不删除文档，也不自动删除存储对象。
  type: object
  additionalProperties: false
  required: [expectedSpaceId, expectedDocumentVersion]
  properties:
    expectedSpaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    expectedDocumentVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
DocsComment:
  type: object
  additionalProperties: false
  required: [id, documentId, body, version, createdAt, updatedAt]
  properties:
    id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    documentId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    body:
      type: string
      minLength: 1
      maxLength: 10000
      description: 保留字面文本，不作为 HTML；拒绝全空白。没有 inline、selection、range、anchor 或 parentCommentId 字段。
    version: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    createdAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
    updatedAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
DocsCommentPage:
  type: object
  additionalProperties: false
  required: [items, nextCursor]
  properties:
    items:
      type: array
      maxItems: 200
      items: { $ref: '../openapi.yaml#/components/schemas/DocsComment' }
    nextCursor: { $ref: '../openapi.yaml#/components/schemas/DocsCursor' }
DocsCreateCommentRequest:
  type: object
  additionalProperties: false
  required: [expectedSpaceId, body]
  properties:
    expectedSpaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    body: { type: string, minLength: 1, maxLength: 10000 }
DocsUpdateCommentRequest:
  type: object
  additionalProperties: false
  required: [expectedSpaceId, expectedVersion, body]
  properties:
    expectedSpaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    expectedVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }
    body: { type: string, minLength: 1, maxLength: 10000 }
DocsDeleteCommentRequest:
  type: object
  additionalProperties: false
  required: [expectedSpaceId, expectedVersion]
  properties:
    expectedSpaceId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    expectedVersion: { $ref: '../openapi.yaml#/components/schemas/DocsVersion' }

DocsTiptapDocument:
  description: '持久正文的完整 Tiptap profile 1 JSON（锁定 Tiptap 3.32.0 完整富文本预设）。本 schema 只约束 JSON 形状与有限值域：Server 另外独立校验节点语法、父子关系、Mark 组合、表格逻辑网格、Unicode 与内容预算（8 MiB 正文、10,000 节点、深度 32、表格网格 10,000）。不接受 Markdown、HTML 字符串、Yjs 数据或浏览器 Editor 对象；null 不是空正文。'
  type: object
  additionalProperties: false
  required: [type, content]
  properties:
    type: { const: doc }
    content:
      description: 输入允许空数组，Server 规范化为至少一个 paragraph；禁止嵌套 doc。
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapNode:
  description: 非 doc 节点的封闭 union；23 个分支靠各自的 type const 互斥，每次只应匹配一个分支。属性对象同样封闭，未知属性由 Server 明确拒绝。
  oneOf:
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapParagraph'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapHeading'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapText'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapHardBreak'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapBlockquote'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapBulletList'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapOrderedList'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapListItem'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapTaskList'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapTaskItem'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapCodeBlock'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapHorizontalRule'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapImage'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapMention'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapDetails'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapDetailsSummary'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapDetailsContent'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapTable'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapTableRow'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapTableCell'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapTableHeader'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapAdmonition'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapAdmonitionTitle'
DocsTiptapParagraph:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: paragraph }
    attrs:
      type: object
      additionalProperties: false
      properties:
        textAlign:
          type: [string, 'null']
          enum: [left, center, right, justify, null]
    content:
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapHeading:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: heading }
    attrs:
      type: object
      additionalProperties: false
      properties:
        level:
          type: integer
          enum: [1, 2, 3, 4]
        textAlign:
          type: [string, 'null']
          enum: [left, center, right, justify, null]
    content:
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapText:
  type: object
  additionalProperties: false
  required: [type, text]
  properties:
    type: { const: text }
    text:
      type: string
      minLength: 1
      description: 唯一允许声明 text 的节点；不能有 attrs 或 content。
    marks:
      type: array
      maxItems: 8
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapMark' }
DocsTiptapHardBreak:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: hardBreak }
    marks:
      type: array
      maxItems: 8
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapMark' }
DocsTiptapBlockquote:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: blockquote }
    content:
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapBulletList:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: bulletList }
    content:
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapOrderedList:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: orderedList }
    attrs:
      type: object
      additionalProperties: false
      properties:
        start:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        type:
          type: [string, 'null']
          enum: ['1', 'a', 'A', 'i', 'I', null]
          description: JSON 中持久为字符串形式。
    content:
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapListItem:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: listItem }
    content:
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapTaskList:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: taskList }
    content:
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapTaskItem:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: taskItem }
    attrs:
      type: object
      additionalProperties: false
      properties:
        checked:
          type: boolean
    content:
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapCodeBlock:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: codeBlock }
    attrs:
      type: object
      additionalProperties: false
      properties:
        language:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9_+\-]*$'
    content:
      description: 只含 text 节点，不带 Marks；保留代码空白。
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapText' }
DocsTiptapHorizontalRule:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: horizontalRule }
DocsTiptapImage:
  description: src 没有默认值，因此 attrs 不可省略。
  type: object
  additionalProperties: false
  required: [type, attrs]
  properties:
    type: { const: image }
    attrs:
      type: object
      additionalProperties: false
      required: [src]
      properties:
        src:
          type: string
          minLength: 1
          description: 安全地址；profile 1 关闭全部 Data URL，不接受 javascript、blob、file 或其他协议，Image 不允许 mailto。
        alt: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        width: { type: [integer, 'null'], minimum: 1, maximum: 8192 }
        height: { type: [integer, 'null'], minimum: 1, maximum: 8192 }
DocsTiptapMention:
  description: id 没有默认值，因此 attrs 不可省略。
  type: object
  additionalProperties: false
  required: [type, attrs]
  properties:
    type: { const: mention }
    attrs:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          description: 内容身份，不是授权凭据。
        label: { type: [string, 'null'] }
        mentionSuggestionChar: { type: string }
DocsTiptapDetails:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: details }
    attrs:
      type: object
      additionalProperties: false
      properties:
        open:
          type: boolean
          description: profile 1 的 Node schema 始终包含 open；persist 是扩展选项而不是文档属性，提交它明确拒绝。
    content:
      description: 由 Server 强制为恰好一个 detailsSummary 加一个 detailsContent。
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapDetailsSummary:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: detailsSummary }
    content:
      description: 只接受可格式化的 text 节点；不接受 hardBreak、Mention 或块节点。
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapText' }
DocsTiptapDetailsContent:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: detailsContent }
    content:
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapTable:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: table }
    content:
      description: 不保存 DOM colgroup、View 或布局按钮。
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapTableRow:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: tableRow }
    content:
      description: 零或多个 cell/header；不设 minItems。上方单元格的 rowspan 可以完整覆盖后续行，因此空行合法，最终仍须通过逻辑网格策略。
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapTableCell:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: tableCell }
    attrs:
      type: object
      additionalProperties: false
      properties:
        colspan:
          type: integer
          minimum: 1
          maximum: 10000
        rowspan:
          type: integer
          minimum: 1
          maximum: 10000
        colwidth:
          description: 非空时数组长度必须等于 colspan，每项为 0 至 8192 的整数。
          type: [array, 'null']
          items: { type: integer, minimum: 0, maximum: 8192 }
        align:
          type: [string, 'null']
          enum: [left, center, right, null]
    content:
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapTableHeader:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: tableHeader }
    attrs:
      type: object
      additionalProperties: false
      properties:
        colspan:
          type: integer
          minimum: 1
          maximum: 10000
        rowspan:
          type: integer
          minimum: 1
          maximum: 10000
        colwidth:
          description: 非空时数组长度必须等于 colspan，每项为 0 至 8192 的整数。
          type: [array, 'null']
          items: { type: integer, minimum: 0, maximum: 8192 }
        align:
          type: [string, 'null']
          enum: [left, center, right, null]
    content:
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapAdmonition:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: admonition }
    attrs:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [tip, info, warning, error]
    content:
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }
DocsTiptapAdmonitionTitle:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: admonitionTitle }
    content:
      type: array
      items: { $ref: '../openapi.yaml#/components/schemas/DocsTiptapNode' }

DocsTiptapMark:
  description: 8 类 Mark 的封闭 union；单个 inline 节点每类最多一个。重复 Mark、互斥组合和错误位置都由 Server 拒绝，不靠合并或丢弃修复。
  oneOf:
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapMarkBold'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapMarkItalic'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapMarkStrike'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapMarkUnderline'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapMarkCode'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapMarkLink'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapMarkHighlight'
    - $ref: '../openapi.yaml#/components/schemas/DocsTiptapMarkTextStyle'
DocsTiptapMarkBold:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: bold }
DocsTiptapMarkItalic:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: italic }
DocsTiptapMarkStrike:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: strike }
DocsTiptapMarkUnderline:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: underline }
DocsTiptapMarkCode:
  description: 沿用完整预设的排他规则，不与其他 Mark 混用。
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: code }
DocsTiptapMarkLink:
  description: href 没有默认值，因此 attrs 不可省略。
  type: object
  additionalProperties: false
  required: [type, attrs]
  properties:
    type: { const: link }
    attrs:
      type: object
      additionalProperties: false
      required: [href]
      properties:
        href:
          type: string
          minLength: 1
          description: 安全地址；Link 另允许有目标的 mailto。_blank 由服务端补入 noopener/noreferrer。
        target:
          type: [string, 'null']
          enum: [_self, _blank, null]
        rel:
          type: [string, 'null']
          description: 仅由 noopener、noreferrer、nofollow 组成，去重并固定 token 顺序。
        class:
          type: 'null'
        title: { type: [string, 'null'] }
DocsTiptapMarkHighlight:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: highlight }
    attrs:
      type: object
      additionalProperties: false
      properties:
        color:
          type: [string, 'null']
          pattern: '^#[0-9a-f]{3}([0-9a-f]{1})?$|^#[0-9a-f]{6}([0-9a-f]{2})?$'
          description: 只接受 #rgb/#rgba/#rrggbb/#rrggbbaa，统一小写；不接受 CSS var、url 或命名颜色。
DocsTiptapMarkTextStyle:
  description: 不允许 fontFamily、lineHeight 或任意 style/class。
  type: object
  additionalProperties: false
  required: [type]
  properties:
    type: { const: textStyle }
    attrs:
      type: object
      additionalProperties: false
      properties:
        color:
          type: [string, 'null']
          pattern: '^#[0-9a-f]{3}([0-9a-f]{1})?$|^#[0-9a-f]{6}([0-9a-f]{2})?$'
        backgroundColor:
          type: [string, 'null']
          pattern: '^#[0-9a-f]{3}([0-9a-f]{1})?$|^#[0-9a-f]{6}([0-9a-f]{2})?$'
        fontSize:
          type: [string, 'null']
          description: 只接受 px/rem 并换算为 0.75 至 3 rem 的有限数值；不接受 NaN、Infinity、calc 或百分比。
