# Docs 领域 operation。全部使用 tag docs；公开 operation 显式 `security: []`，登录 operation 显式 `bearerAuth: []`。
# 每个 operation 的 `x-fastify-config.docs` 是注册配置，不是用户请求字段；只允许列出的键，且由 Server 在注册时校验。

/docs/spaces:
  get:
    operationId: listDocsSpaces
    summary: List Docs spaces
    description: 'Public read. Keyset pagination ordered by (createdAt, id) ascending. `limit` defaults to 100 and is clamped to 1..200; `cursor` is opaque and bound to the tree generation. The page never exposes trashed content and never writes state.'
    security: []
    tags: [docs]
    x-fastify-config:
      docs:
        kind: read
    parameters:
      - name: limit
        in: query
        required: false
        description: 'Page size. Defaults to 100.'
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: cursor
        in: query
        required: false
        description: 'Opaque cursor returned by a previous page of the same query.'
        schema:
          type: string
          minLength: 1
          maxLength: 1024
    responses:
      '200':
        description: One page of spaces.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/DocsSpacePage'
      '400':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '503':
        $ref: '../openapi.yaml#/components/responses/RetryableErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
  post:
    operationId: createDocsSpace
    summary: Create a Docs space
    description: 'Creates one space with its name and description. The caller never supplies id, version, treeVersion or timestamps; those are server-owned fields and are rejected when written.'
    security:
      - bearerAuth: []
    tags: [docs]
    x-fastify-config:
      docs:
        kind: command
        wireBytes: 65536
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/DocsCreateSpaceRequest'
    responses:
      '201':
        description: The created space.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/DocsSpace'
      '400':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '401':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '413':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '415':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '503':
        $ref: '../openapi.yaml#/components/responses/RetryableErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
/docs/spaces/{spaceId}:
  get:
    operationId: getDocsSpace
    summary: Read one Docs space
    description: 'Public read. Returns the current space snapshot including its tree version. Unknown ids and trashed-only content merge into a neutral 404.'
    security: []
    tags: [docs]
    x-fastify-config:
      docs:
        kind: read
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          $ref: '../openapi.yaml#/components/schemas/Uuid'
    responses:
      '200':
        description: The space snapshot.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/DocsSpace'
      '400':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '404':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '503':
        $ref: '../openapi.yaml#/components/responses/RetryableErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
  patch:
    operationId: updateDocsSpace
    summary: Update a Docs space name and description
    description: 'A complete replacement of the name and description, not a partial patch; optional fields would make "clear" ambiguous. `expectedVersion` must match the stored space version, otherwise 409 and the caller re-reads before retrying.'
    security:
      - bearerAuth: []
    tags: [docs]
    x-fastify-config:
      docs:
        kind: command
        wireBytes: 65536
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          $ref: '../openapi.yaml#/components/schemas/Uuid'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/DocsUpdateSpaceRequest'
    responses:
      '200':
        description: The space snapshot after the update.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/DocsSpace'
      '400':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '401':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '404':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '409':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '413':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '415':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '503':
        $ref: '../openapi.yaml#/components/responses/RetryableErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
/docs/spaces/{spaceId}/delete:
  post:
    operationId: deleteDocsSpace
    summary: Delete an empty Docs space
    description: 'Deletion succeeds only when the space currently holds no document row and no template row; it does not require that nothing was ever written. Trashed documents and templates both count as references, so a trashed-only space is still non-empty and cannot be deleted. Uses POST so the version fields are carried in a validated JSON body.'
    security:
      - bearerAuth: []
    tags: [docs]
    x-fastify-config:
      docs:
        kind: command
        wireBytes: 65536
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          $ref: '../openapi.yaml#/components/schemas/Uuid'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/DocsDeleteSpaceRequest'
    responses:
      '204':
        description: The space was deleted; no body.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
      '400':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '401':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '404':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '409':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '413':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '415':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '503':
        $ref: '../openapi.yaml#/components/responses/RetryableErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
/docs/spaces/{spaceId}/tree:
  get:
    operationId: getDocsTree
    summary: Read one level of a space document tree
    description: 'Public read. Only active nodes are returned. Omit `parentId` to read the root level; it must never be sent as the string null. An existing but empty level returns 200 with empty items, which never masks an unavailable parent: a parent that does not exist in this space, or that is trashed, is 404, and a parent id owned by another space merges into the same 404. A cursor whose space or parent level does not match the query is 400; a cursor bound to a different tree version is 409 DOCS_TREE_CHANGED and the caller restarts pagination.'
    security: []
    tags: [docs]
    x-fastify-config:
      docs:
        kind: read
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          $ref: '../openapi.yaml#/components/schemas/Uuid'
      - name: parentId
        in: query
        required: false
        description: 'Parent document id. Omitted means the root level.'
        schema:
          $ref: '../openapi.yaml#/components/schemas/Uuid'
      - name: limit
        in: query
        required: false
        description: 'Page size. Defaults to 100.'
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: cursor
        in: query
        required: false
        description: 'Opaque cursor returned by a previous page of the same space and parent.'
        schema:
          type: string
          minLength: 1
          maxLength: 1024
    responses:
      '200':
        description: One page of active tree nodes and the current tree version.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/DocsTreePage'
      '400':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '404':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '409':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '503':
        $ref: '../openapi.yaml#/components/responses/RetryableErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
/docs/spaces/{spaceId}/documents:
  post:
    operationId: createDocsDocument
    summary: Create a document in a space
    description: 'Creates one document under `parentId` (null means the space root) at the position implied by `beforeDocumentId` (null appends to the end of the level). The parent and the anchor must belong to the path space and be active. The body is required; an empty document is expressed as an empty doc or a single paragraph. The request is subject to the 9 MiB content wire budget and to the 8 MiB content profile budget, plus the per-space 10,000 physical row quota.'
    security:
      - bearerAuth: []
    tags: [docs]
    x-fastify-config:
      docs:
        kind: content
        wireBytes: 9437184
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          $ref: '../openapi.yaml#/components/schemas/Uuid'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/DocsCreateDocumentRequest'
    responses:
      '201':
        description: The created document and the new tree version.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/DocsDocumentResult'
      '400':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '401':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '404':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '409':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '413':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '415':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '503':
        $ref: '../openapi.yaml#/components/responses/RetryableErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
