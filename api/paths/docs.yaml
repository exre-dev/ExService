    operationId: getDocsDocument
    summary: Read one active document
    description: 'Public read. Returns the normalized body together with the document version and the current tree version. A trashed id, an unknown id and an id that resolves to trashed content all merge into a neutral 404 DOCS_NOT_FOUND, so this operation never discloses trashed content.'
    security: []
    tags: [docs]
    x-fastify-config:
      docs:
        kind: read
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          $ref: '../openapi.yaml#/components/schemas/Uuid'
    responses:
      '200':
        description: The document and the current tree version.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
