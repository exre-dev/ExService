  /auth/oidc/logout/accept:
    $ref: ./paths/identity.yaml#/~1auth~1oidc~1logout~1accept
  /internal/identity/session/check:
    $ref: ./paths/identity.yaml#/~1internal~1identity~1session~1check
  /internal/identity/session/revoke:
    $ref: ./paths/identity.yaml#/~1internal~1identity~1session~1revoke
  /internal/identity/user/inspect:
    $ref: ./paths/identity.yaml#/~1internal~1identity~1user~1inspect
  /storage/uploads/prepare:
    $ref: ./paths/storage.yaml#/~1storage~1uploads~1prepare
  /storage/uploads:
    $ref: ./paths/storage.yaml#/~1storage~1uploads
  /storage/uploads/complete:
    $ref: ./paths/storage.yaml#/~1storage~1uploads~1complete
  /storage/files:
    $ref: ./paths/storage.yaml#/~1storage~1files
  /notifications:
    $ref: ./paths/notifications.yaml#/~1notifications
  /notifications/summary:
    $ref: ./paths/notifications.yaml#/~1notifications~1summary
  /notifications/{notificationId}:
    $ref: ./paths/notifications.yaml#/~1notifications~1{notificationId}
  /notifications/{notificationId}/state:
    $ref: ./paths/notifications.yaml#/~1notifications~1{notificationId}~1state
  /notifications/read-all:
    $ref: ./paths/notifications.yaml#/~1notifications~1read-all
  /notifications/clear-preview:
