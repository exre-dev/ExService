extends:
  - recommended

rules:
  # PHP 内部契约使用 sessionAuth，公开契约使用各自的 OAuth 安全声明。
  security-defined: off

  # PHP 业务错误按具体状态返回 {msg}；不要求每个 operation 重复 4xx 声明。
  operation-4xx-response: off

  # storageComplete 在当前 PHP 部署中固定返回 503，不存在成功响应。
  operation-2xx-response: off

  # 本仓库没有确定许可证。
  # 与其填入未经确认的 license，不如显式关闭该规则。
  info-license: off
